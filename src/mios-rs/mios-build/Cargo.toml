[package]
name = "mios-build"
version.workspace = true
edition.workspace = true
description = "MiOS native build orchestrator and phase registry"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"

[dev-dependencies]
insta = { version = "1.34", features = ["yaml"] }
tempfile = "3.8"
trycmd = "0.14"

