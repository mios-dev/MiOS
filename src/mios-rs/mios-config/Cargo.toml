# AI-hint: TOML Configuration
[package]
name = "mios-config"
version.workspace = true
edition.workspace = true
description = "Typed figment-based configuration resolver for MiOS"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
figment = { version = "0.10", features = ["toml", "env"] }
toml = "0.8"
miette = { version = "7.0", features = ["fancy"] }
thiserror = "2.0"
