# AI-hint: Defines the WSL2-specific artifact configuration for the MiOS build system, specifying user account defaults and kernel parameters for the `wsl --import` workflow.
# AI-doc: usr/share/doc/mios/manual/_harvest/config_artifacts_wsl2_toml.md

[[customizations.user]]
name     = "mios"
# No password or SSH key needed for WSL -- Windows auth is used.
# Set a password if you want: openssl passwd -6 'your-password'
groups   = ["wheel"]

[customizations.kernel]
# WSL2 uses the Microsoft kernel -- kargs are ignored but kept for parity.
append = ""
