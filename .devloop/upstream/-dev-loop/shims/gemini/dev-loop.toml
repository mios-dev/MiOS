description = "Run the Dev Loop (verify-hard, two-sided controls, worktree lanes) on an objective"
prompt = """
Load the `dev-loop` skill (SKILL.md in .gemini/skills/dev-loop/, .agents/skills/dev-loop/, or ~/.gemini/skills/dev-loop/) and execute its lifecycle (§1) for this objective:

{{args}}

Orient first: `AGENTS.md`, the last entry of `.devloop/LEDGER.md`, `TASKS.md`; if the canonical artifacts are missing run `python3 scripts/artifacts.py scaffold` (§3). Flip the task in `.devloop/tasks.jsonl` and append a ledger entry before you stop.
Write the Definition of Done first (§2); run both controls before claiming done (§6); explicit-path staging only (§12); end with the `devloop_report` JSON block (§13).
If the objective starts with `lanes:`, you are the L0 host: read references/harness-adapters.md, then run `sh scripts/devloop.sh <path>` (or the PowerShell twin) with the shell tool and report from .devloop/run-*/report-*.json.

Repo state: !{git status --short | head -30}
!{git log --oneline -10}
"""
