[command]
name = "ship"
description = "Safe trunk-based branch merger, worktree pruner, and changelog updater"
version = "2.0.0"
entrypoint = "python3 scripts/ship.py"
aliases = ["sh"]

[parameters]
source = { type = "string", description = "Source feature or lane branch", required = true }
target = { type = "string", description = "Target trunk branch", default = "main" }
tag = { type = "string", description = "Optional release tag", required = false }
