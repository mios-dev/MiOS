[command]
name = "goal"
description = "Goal-driven autonomous engineering engine with verifiable stopping conditions"
version = "2.0.0"
entrypoint = "python3 scripts/goal.py"

[parameters]
mode = { type = "string", description = "Execution mode: dev, init, eval, status", default = "dev" }
objective = { type = "string", description = "High-level goal objective", required = true }
stopping_condition = { type = "string", description = "Verifiable stopping criteria", required = false }

[protocols]
loop_heartbeat = true
two_sided_verification = true
artifact_hashing = true
