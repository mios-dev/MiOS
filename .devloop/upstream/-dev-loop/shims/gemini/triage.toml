[command]
name = "triage"
description = "Automated phantom-failure diagnosis and flakiness isolation"
version = "2.0.0"
entrypoint = "python3 scripts/triage.py"
aliases = ["tr"]

[parameters]
command = { type = "string", description = "Failing test or verification command", required = true }
runs = { type = "integer", description = "Repetitions to detect flakiness", default = 3 }
