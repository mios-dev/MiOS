# AI-hint: Ventoy/GRUB loopback multiboot menu TEMPLATE; @@DATA_LABEL@@/@@REPO_LABEL@@ substituted from mios.toml [cat.data_partition].label / [cat.repo_partition].label by installation/stage-mios-repo.sh. Boots the staged self-contained Anaconda-bootc MiOS.iso (IMMUTABLE bootc image), NOT plain mutable Fedora.
# AI-related: usr/share/mios/mios.toml, installation/stage-mios-repo.sh, tools/install.sh, usr/share/mios/ventoy/ventoy.json, automation/98-drift-checks.sh
# ----------------------------------------------------------------------------
# Path A (preferred): boot the self-contained Anaconda-bootc installer ISO that
# BIB emits (embeds ghcr.io/mios-dev/mios), so Anaconda writes the ostree/bootc
# image to disk -- a real immutable install, offline. Staged to
# @@DATA_LABEL@@/Live_Operating_Systems/MiOS.iso by installation/stage-mios-repo.sh.
menuentry "Install MiOS (Immutable bootc Workstation & Agentic AI OS)" {
    search --set=root --label @@DATA_LABEL@@
    set iso=/Live_Operating_Systems/MiOS.iso
    loopback loop $iso
    linux (loop)/images/pxeboot/vmlinuz inst.stage2=hd:LABEL=@@DATA_LABEL@@:$iso quiet
    initrd (loop)/images/pxeboot/initrd.img
}

# Path B (rescue / no-Anaconda): boot the same ISO's kernel but hand control to the
# embedded kickstart on the brain partition, which mounts @@REPO_LABEL@@ and runs
# tools/install.sh -> `bootc install --transport oci-archive` from the staged
# /mnt/mios-repo/mios-latest.tar. Zero-network. Restores the caller drift-check 85 assumes.
menuentry "Install MiOS from OCI archive (rescue: bootc install --transport oci-archive)" {
    search --set=root --label @@DATA_LABEL@@
    set iso=/Live_Operating_Systems/MiOS.iso
    loopback loop $iso
    linux (loop)/images/pxeboot/vmlinuz rd.live.image inst.ks=hd:LABEL=@@REPO_LABEL@@:/ventoy/mios-oci-install.ks quiet
    initrd (loop)/images/pxeboot/initrd.img
}

# Live / Rescue: boot the ISO's live environment for diagnostics (no install).
menuentry "MiOS Live / Rescue Environment" {
    search --set=root --label @@DATA_LABEL@@
    set iso=/Live_Operating_Systems/MiOS.iso
    loopback loop $iso
    linux (loop)/images/pxeboot/vmlinuz rd.live.image quiet
    initrd (loop)/images/pxeboot/initrd.img
}
