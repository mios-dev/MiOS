# AI-hint: Defines pinned SHA256 digests for base images and bootc-image-builder tools, used by Renovate to automate image updates and by build scripts to ensure reproducible MiOS builds.
# AI-doc: usr/share/doc/mios/manual/_harvest/image_versions_yml.md

# ucore-hci:stable-nvidia  Universal Blue CoreOS with pre-signed NVIDIA
# renovate: datasource=docker depName=ghcr.io/ublue-os/ucore-hci
# Digest of the stable-nvidia multi-arch index (amd64+arm64). Renovate keeps it
# current (7-day stability) when upstream republishes the tag; resolve manually
# with: skopeo inspect --format '{{.Digest}}' docker://ghcr.io/ublue-os/ucore-hci:stable-nvidia
ucore_hci_stable_nvidia_digest: sha256:9f59db30208d0d8284242a99fe14b7cd32966d038d374c8330dcd3b51bbad476


rechunk:
  # bootc-base-imagectl  image rechunking for efficient Day-2 updates
  # Run after build, before push:
  #   bootc-base-imagectl rechunk --max-layers 67 mios:latest
  tool: bootc-base-imagectl # @track:IMG_RECHUNKER
  max_layers: 67
