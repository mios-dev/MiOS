# AI-hint: Cargo manifest for mios-comment-lex -- the native comment lexer for mios-manual.
[package]
name = "mios-comment-lex"
version.workspace = true
edition.workspace = true

[dependencies]
clap = { version = "4.4", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
regex = "1.10"
