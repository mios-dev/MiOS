[workspace]
members = [
    "generate-names-registry",
    "mios-agent-relay",
    "mios-ai-config",
    "mios-aiplane-lint",
    "mios-bake-plan",
    "mios-browser",
    "mios-comment-lex",
    "mios-drift-runner",
    "mios-edge-status",
    "mios-install",
    "mios-launch",
    "mios-render-quadlets",
    "mios-resolver",
    "mios-service-core",
    "mios-size-ceiling",
    "mios-ssot-lint",
    "mios-ssot-walk",
    "mios-task",
    "mios-template-compile",
    "mios-template-conform",
    "mios-toml-get",
    "mios-toolchain-pin",
    "mios-unit-gen",
    "mios-version-check",
    "mios-wallpaperd",
    "xtask",
]
resolver = "2"

[workspace.package]
version = "0.3.0"
edition = "2021"

[workspace.dependencies]
clap = { version = "4.5", features = ["derive"] }
figment = { version = "0.10", features = ["toml", "env"] }
miette = { version = "5.10", features = ["fancy"] }
regex = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tempfile = "3.10"
thiserror = "1.0"
toml = "0.8"
walkdir = "2.4"
