# AI-hint: Publishes [image].machine_os_mirror, the container-only and digest-identical copy of the podman machine OS that the MiOS dev image and the drift-gate container build FROM.
# AI-related: tools/mirror-machine-os.sh, usr/share/mios/mios.toml
name: machine-os-mirror

on:
  push:
    branches: [main]
    paths:
      - usr/share/mios/mios.toml
      - tools/mirror-machine-os.sh
      - .github/workflows/machine-os-mirror.yml
  # Upstream re-pushes a stable tag for its point releases.
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  mirror:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to ghcr.io
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: podman login ghcr.io -u "${{ github.actor }}" --password-stdin <<< "$GH_TOKEN"

      - name: Mirror the container images
        run: bash ./tools/mirror-machine-os.sh .
