# AI-hint: GitHub Actions workflow for building, tagging, and pushing MiOS OCI images to ghcr.io using podman to ensure bit-for-bit parity between GitHub and Forgejo build environments.
# AI-doc: usr/share/doc/mios/manual/workflows.md
name: mios-ci


on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

# Supersede stale PR bakes; never cancel main -- that run publishes and signs.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  MIOS_DRIFT_REQUIRE_TOOLS: "1"
  PUBLISH: 'true'

jobs:
  # WS-0A drift gate: source-tree fitness-functions that need NO built image.
  # Runs first and fast so drift (un-wired SSOT keys, broken orchestration
  # leaves) fails the PR before the expensive OCI bake. Mirrors the post-build
  # sub-phases in automation/build.sh and the `just drift-gate` target.
  drift-gate:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enforce generated SSOT synchronization (sync-generated.sh)
        run: |
          bash ./tools/sync-generated.sh
          if [[ -n "$(git status --porcelain)" ]]; then
            echo "ERROR: The following generated artifacts are out of sync with SSOT:" >&2
            git status --porcelain >&2
            # The filename alone is not actionable: a generator that produces
            # different bytes here than on a contributor's box has to be
            # diagnosed from the CONTENT, and this failure has already cost a
            # round trip that a diff would have ended.
            echo "--- diff (generated vs committed) ---" >&2
            git --no-pager diff --stat >&2 || true
            git --no-pager diff | head -200 >&2 || true
            exit 1
          fi

      - name: Install shellcheck, powershell and .NET SDK
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y shellcheck powershell dotnet-sdk-8.0 bubblewrap || true
          # pyflakes backs lint-python.sh's undefined-name pass; without it that
          # pass fails closed under MIOS_DRIFT_REQUIRE_TOOLS=1.
          python3 -m pip install --quiet --disable-pip-version-check pyflakes \
            || python3 -m pip install --quiet --disable-pip-version-check --break-system-packages pyflakes \
            || true

      - name: Shell linting (lint-shell.sh)
        run: bash ./automation/lint-shell.sh

      - name: Python linting (lint-python.sh)
        run: bash ./automation/lint-python.sh

      - name: JSON syntax gate (lint-json.sh)
        run: bash ./automation/lint-json.sh

      - name: PowerShell AST parse-gate (lint-powershell.sh)
        run: bash ./automation/lint-powershell.sh

      - name: PSScriptAnalyzer static analysis (lint-ps-analyzer.sh)
        run: bash ./automation/lint-ps-analyzer.sh

      - name: PowerShell Pester test suite (run-pester.sh)
        run: bash ./tests/powershell/run-pester.sh

      - name: Dispatch sandbox seccomp filter (test-sandbox-seccomp.sh)
        # bubblewrap is installed above, so the live tier really runs: it asserts
        # the confined process loads a filter instead of reporting `Seccomp: 0`.
        run: bash ./tests/test-sandbox-seccomp.sh

      - name: PowerShell object-flattening (test-powershell-flatten.sh)
        # The runner installs powershell above, so the live tier really runs
        # here: a console-less runspace renders every object as a blank line,
        # and only executing pwsh proves the wrapper fixes it.
        run: bash ./tests/test-powershell-flatten.sh

      # Must precede the negatives: this binary IS check_unit_projection's
      # rendering half. Rationale: commit 8abb1e0f.
      - name: Build the native gates' binaries (unit-projection + resolver parity)
        run: cd ./tools/native && cargo build -p mios-unit-gen -p mios-resolver

      - name: Negative tests (drift-gate-negatives.sh)
        run: bash ./tests/drift-gate-negatives.sh

      - name: pgvector PG-major migration safety (test-pgvector-major-upgrade.sh)
        # Hermetic: stubs podman and works on a throwaway fixture, so it belongs
        # in the DB-less drift-gate. It asserts the migration guard never
        # destroys a cluster on any failure path -- worth enforcing here rather
        # than only under `just drift-gate`.
        run: bash ./tests/test-pgvector-major-upgrade.sh

      - name: Documentation harvest round-trip (test-mios-manual-harvest.sh)
        run: bash ./tests/test-mios-manual-harvest.sh

      - name: Offload is an /etc overlay (tests/test-offload-overlay.py)
        # ADR-0016's central claim, made executable.
        run: python3 ./tests/test-offload-overlay.py

      - name: A seat can see whether its blade is there (tests/test-blade-reachability.sh)
        run: bash ./tests/test-blade-reachability.sh

      - name: A seat's auth posture follows its role (tests/test-seat-auth-posture.sh)
        run: bash ./tests/test-seat-auth-posture.sh

      - name: A seat activates nothing (tests/test-seat-activates-nothing.py)
        # The executable definition of MiOS-Mini.
        run: python3 ./tests/test-seat-activates-nothing.py

      - name: Greenboot skips what the blade does not activate
        # Without this guard a seat rolls itself back on every boot.
        run: bash ./tests/test-greenboot-blade-guard.sh

      - name: A seat records its blade's reachability (tests/test-greenboot-blade-reachability.sh)
        run: bash ./tests/test-greenboot-blade-reachability.sh

      - name: Lint coverage (python + shell file sets)
        # Assert the linters still SEE every payload area. Enumerating dirs one
        # at a time is what left usr/share/mios unscanned; the shell twin had
        # never been wired into any runner at all.
        run: |
          bash ./tests/test-lint-python-coverage.sh
          bash ./tests/test-lint-shell-coverage.sh
      - name: OWUI pipe endpoint resolution (tests/test-owui-pipe-endpoints.py)
        # The canonical OWUI entry point must import and resolve its backend from
        # the SSOT; it did neither. Skips itself if pydantic/aiohttp are absent.
        run: python3 ./tests/test-owui-pipe-endpoints.py
      - name: Manuals & docs production evidence (doc-production-evidence.sh)
        # Prints what the documentation programme produced, then re-runs its read-only gates.
        run: bash ./tests/doc-production-evidence.sh

      - name: tools/ sibling unit tests
        # check_module_test_coverage REQUIRES a tools/test_<module>.py beside
        # every tools/ module, but nothing executed them -- one had been failing
        # on the default branch unnoticed. Run them.
        run: |
          cd ./tools
          fails=0
          for t in test_*.py; do
            if python3 "$t" >/dev/null 2>&1; then echo "  [ OK ] $t"
            else echo "  [FAIL] $t"; python3 "$t" || true; fails=$((fails + 1)); fi
          done
          [ "$fails" -eq 0 ] || { echo "$fails tools test(s) failed" >&2; exit 1; }

      - name: SSOT-render conformance lint (97-ssot-lint.sh)
        run: bash ./automation/97-ssot-lint.sh

      - name: Rust formatting & clippy (-D warnings)
        run: |
          rustup component add clippy rustfmt || true
          cd ./src/mios-rs && cargo fmt --all --check && cargo clippy --workspace --all-targets -- -D warnings
          cd ../../tools/native && cargo fmt --all --check && cargo clippy --workspace --exclude mios-wallpaperd --all-targets -- -D warnings

      - name: Native Rust tests
        run: |
          cd ./src/mios-rs && cargo test --workspace
          cd ../../tools/native && cargo test --workspace --exclude mios-wallpaperd

      - name: Agent-pipe unit tests (test_mios_*.py)
        run: |
          cd ./usr/lib/mios/agent-pipe
          python3 -m pip install --quiet --disable-pip-version-check fastapi httpx \
            || python3 -m pip install --quiet --disable-pip-version-check --break-system-packages fastapi httpx \
            || true
          SKIP=" test_mios_config_audit.py test_mios_redact.py test_mios_vector.py test_mios_gateway_agent.py test_mios_gateway_queue.py test_mios_admission.py test_mios_mcp_pool.py test_mios_bench_harness.py "
          fails=0
          for t in test_mios_*.py; do
            case "$SKIP" in *" $t "*) echo "  [SKIP] $t (DB/heavy-dep -- runs in build-job venv gate)"; continue;; esac
            if python3 "$t" >/dev/null 2>&1; then
              echo "  [ OK ] $t"
            else
              echo "  [FAIL] $t"; python3 "$t" || true; fails=$((fails + 1))
            fi
          done
          if [ "$fails" -gt 0 ]; then
            echo "::error::${fails} agent-pipe test script(s) failed"; exit 1
          fi

      - name: Libexec unit tests (usr/libexec/mios/test_mios_*.py)
        # Loops the directory so a new libexec test is never silently unrun.
        run: |
          cd ./usr/libexec/mios
          fails=0
          for t in test_mios_*.py; do
            if python3 "$t" >/dev/null 2>&1; then
              echo "  [ OK ] $t"
            else
              echo "  [FAIL] $t"; python3 "$t" || true; fails=$((fails + 1))
            fi
          done
          if [ "$fails" -gt 0 ]; then
            echo "::error::${fails} libexec test(s) failed"; exit 1
          fi
      - name: AI-plane source drift checks (98-drift-checks.sh)
        run: bash ./automation/98-drift-checks.sh

      - name: Drift-gate negative self-tests (drift-gate-negatives.sh)
        run: bash ./tests/drift-gate-negatives.sh

  build:
    needs: drift-gate
    runs-on: ubuntu-24.04
    env:
      MIOS_VENDOR_TOML: ${{ github.workspace }}/usr/share/mios/mios.toml
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # build.sh's POST-build drift phase re-runs 98-drift-checks.sh -> check_shellcheck
      # -> lint-shell.sh on THIS runner. The drift-gate job installs shellcheck but the
      # build job did not, so that re-run skipped the lint (false-green). Install it here
      # too so the build-job lint GATES. (lint-shell.sh also self-provisions as a fallback.)
      - name: Install shellcheck
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y shellcheck

      - name: Read VERSION
        id: ver
        # VERSION must yield ONE clean token. Strip comment lines (e.g. a
        # stray AI-hint header) + all whitespace so a multi-line value can't
        # write a bare line to $GITHUB_OUTPUT ("Invalid format" failure).
        run: |
          ver="$(grep -vE '^[[:space:]]*#' VERSION | tr -d '[:space:]')"
          echo "version=${ver:-0.0.0}" >> "$GITHUB_OUTPUT"

      - name: Resolve image tag (VERSION + UTC timestamp + short SHA)
        id: tag
        run: |
          VER="$(grep -vE '^[[:space:]]*#' VERSION 2>/dev/null | tr -d '[:space:]')"; VER="${VER:-v0.0.0}"
          SHA="$(git rev-parse --short=12 HEAD)"
          TS="$(date -u +%Y%m%d-%H%M%S)"
          TAG="${VER#v}-${TS}-${SHA}"
          echo "image_tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Building tag: ${TAG}"

      - name: Install podman
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y podman skopeo

      - name: Configure host podman storage (disable metacopy)
        run: |
          sudo mkdir -p /etc/containers /mnt/tmp
          echo -e '[storage]\ndriver = "overlay"\ngraphroot = "/mnt/containers-storage"\nrunroot = "/run/containers/storage"\n[storage.options.overlay]\nmountopt = "nodev"' | sudo tee /etc/containers/storage.conf
          sudo rm -rf /var/lib/containers/storage /run/containers/storage /mnt/containers-storage
          rm -rf "${HOME}/.local/share/containers/storage" 2>/dev/null || true
          sudo podman system reset -f || true

      - name: Free disk space on the GHA runner
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Login to GHCR (raise base-image pull rate limit)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GH_TOKEN" | sudo podman login ghcr.io \
              -u "${{ github.actor }}" --password-stdin

      - name: Build OCI image (parity with Forgejo Runner)
        run: |
          set -euo pipefail
          # Source build-args from /etc/mios/install.env if present
          # (matches Forgejo runner behavior). On GitHub-hosted runners
          # there's no install.env so the build uses Containerfile
          # defaults — which is the correct vendor-neutral build.
          BUILD_ARGS=()
          if [[ -r /etc/mios/install.env ]]; then
              # shellcheck source=/dev/null
              source /etc/mios/install.env
              [[ -n "${MIOS_LINUX_USER:-}"        ]] && BUILD_ARGS+=(--build-arg "MIOS_USER=${MIOS_LINUX_USER}")
              [[ -n "${MIOS_HOSTNAME:-}"          ]] && BUILD_ARGS+=(--build-arg "MIOS_HOSTNAME=${MIOS_HOSTNAME}")
              [[ -n "${MIOS_AI_MODEL:-}"          ]] && BUILD_ARGS+=(--build-arg "MIOS_AI_MODEL=${MIOS_AI_MODEL}")
              [[ -n "${MIOS_AI_EMBED_MODEL:-}"    ]] && BUILD_ARGS+=(--build-arg "MIOS_AI_EMBED_MODEL=${MIOS_AI_EMBED_MODEL}")
          fi
          SOURCE_DATE_EPOCH=$(git -C "$GITHUB_WORKSPACE" log -1 --format=%ct 2>/dev/null || date +%s)
          export SOURCE_DATE_EPOCH
          # SOURCE_DATE_EPOCH (env) is the reproducible-builds standard and podman
          # honours it for layer timestamps on its own. Passing --timestamp as well
          # is the SAME setting twice, and podman refuses the pair outright:
          # "timestamp and source-date-epoch would be ambiguous if allowed together"
          # (exit 125, before the Containerfile is even read). Keep the env form.
          sudo TMPDIR=/mnt/tmp SOURCE_DATE_EPOCH="$SOURCE_DATE_EPOCH" podman build \
              "${BUILD_ARGS[@]}" \
              --build-arg SOURCE_DATE_EPOCH="$SOURCE_DATE_EPOCH" \
              --device /dev/fuse \
              --cap-add all \
              --security-opt seccomp=unconfined \
              --security-opt apparmor=unconfined \
              --retry 5 --retry-delay 3s \
              --build-arg MIOS_BAKE_BOUND_IMAGES=${{ env.PUBLISH == 'true' && '1' || '0' }} \
              -f Containerfile \
              -t "localhost/mios:latest" \
              -t "localhost/mios:${{ steps.tag.outputs.image_tag }}" \
              .

      - name: Verify bootc lint passes (Architectural Law 4)
        run: |
          # Containerfile already runs `bootc container lint` as the
          # final build step. Belt-and-suspenders check: confirm the
          # freshly-built image still carries the required bootc labels.
          # Identical check to .forgejo/workflows/build-mios.yml.
          # sudo: read from rootful storage where the build placed the image
          sudo podman image inspect localhost/mios:latest \
              --format '{{ index .Config.Labels "containers.bootc" }}' \
              | grep -qx '1' || {
                  echo "ERROR: built image missing containers.bootc=1 label" >&2
                  exit 1
              }
          sudo podman image inspect localhost/mios:latest \
              --format '{{ index .Config.Labels "ostree.bootable" }}' \
              | grep -qx '1' || {
                  echo "ERROR: built image missing ostree.bootable=1 label" >&2
                  exit 1
              }

      - name: Rechunk for smaller Day-2 deltas (validates on PRs too)
        # PRs exercise the rechunkers (warn-only, image discarded); main additionally publishes the result.
        if: env.PUBLISH == 'true'
        run: |
          set -uo pipefail
          IMAGE_TAG="localhost/mios:${{ steps.tag.outputs.image_tag }}"
          MAX_LAYERS="${MIOS_RECHUNK_MAX_LAYERS:-67}"
          # sudo: rechunk reads from + writes to rootful storage
          _RECHUNKED=""
          if sudo podman run --rm --privileged \
              -v /mnt/containers-storage:/var/lib/containers/storage \
              "${IMAGE_TAG}" \
              rpm-ostree compose build-chunked-oci --bootc --format-version=2 \
                  --from="containers-storage:${IMAGE_TAG}" \
                  --output="containers-storage:${IMAGE_TAG}-rechunked"; then
              _RECHUNKED=1
              echo "rechunk: rpm-ostree build-chunked-oci --format-version=2 OK"
          elif sudo podman run --rm \
              --security-opt label=type:unconfined_t \
              -v /mnt/containers-storage:/var/lib/containers/storage \
              "${IMAGE_TAG}" \
              /usr/libexec/bootc-base-imagectl rechunk \
                  --max-layers "${MAX_LAYERS}" \
                  "containers-storage:${IMAGE_TAG}" \
                  "containers-storage:${IMAGE_TAG}-rechunked"; then
              _RECHUNKED=1
              echo "rechunk: bootc-base-imagectl fallback OK"
          fi
          # Strict on PRs, degrade-open on main: a lossless layering win must never block a publish.
          if [[ -n "${_RECHUNKED}" ]]; then
              sudo podman tag "${IMAGE_TAG}-rechunked" "${IMAGE_TAG}"
          elif [[ "${{ github.event_name }}" == "pull_request" ]]; then
              echo "::error::all rechunkers failed -- pre-merge rechunk validation is strict"
              exit 1
          else
              echo "WARN: all rechunkers failed; publishing un-rechunked image" >&2
          fi
          sudo podman tag "${IMAGE_TAG}" "localhost/mios:latest"

      - name: Compute registry tags
        id: meta
        if: env.PUBLISH == 'true' && github.event_name != 'pull_request'
        run: |
          source ./tools/lib/userenv.sh
          if [[ -z "${MIOS_IMAGE_NAME:-}" ]]; then
              echo "ERROR: MIOS_IMAGE_NAME is empty" >&2
              exit 1
          fi
          if [[ "$MIOS_IMAGE_NAME" != */* ]]; then
              echo "ERROR: MIOS_IMAGE_NAME must contain a registry host (e.g. ghcr.io/...)" >&2
              exit 1
          fi
          BASE="${MIOS_IMAGE_NAME}"
          TAGS=()
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
              TAGS+=("${BASE}:latest")
              TAGS+=("${BASE}:${{ steps.ver.outputs.version }}")
          fi
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
              SEMVER="${GITHUB_REF#refs/tags/v}"
              TAGS+=("${BASE}:${SEMVER}")
              TAGS+=("${BASE}:latest")
          fi
          TAGS+=("${BASE}:${{ steps.tag.outputs.image_tag }}")
          {
              echo "tags<<EOF"
              printf '%s\n' "${TAGS[@]}"
              echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR (push step)
        if: env.PUBLISH == 'true' && github.event_name != 'pull_request'
        run: |
          source ./tools/lib/userenv.sh
          if [[ -z "${MIOS_IMAGE_NAME:-}" ]]; then
              echo "ERROR: MIOS_IMAGE_NAME is empty" >&2
              exit 1
          fi
          if [[ "$MIOS_IMAGE_NAME" != */* ]]; then
              echo "ERROR: MIOS_IMAGE_NAME must contain a registry host (e.g. ghcr.io/...)" >&2
              exit 1
          fi
          REG_HOST="${MIOS_IMAGE_NAME%%/*}"
          echo "${{ secrets.GITHUB_TOKEN }}" | \
              sudo podman login -u "${{ github.actor }}" --password-stdin "${REG_HOST}"

      - name: Push to GHCR
        if: env.PUBLISH == 'true' && github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          while IFS= read -r tag; do
              [[ -z "$tag" ]] && continue
              sudo podman tag localhost/mios:latest "$tag"
              sudo podman push "$tag"
              echo "Pushed: $tag"
          done <<< "${{ steps.meta.outputs.tags }}"

      - name: Install cosign
        if: env.PUBLISH == 'true' && github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@v3

      # Sign EVERY pushed image (including :latest from main), not just v* tags
      # -- closes the "unsigned :latest" gap and makes the SECURITY.md "CI signs
      # every push with cosign keyless" claim true. Keyless OIDC; needs the
      # job's `permissions: id-token: write` (already set -- the v-tag .sig
      # objects in GHCR prove keyless signing works)..
      - name: Cosign keyless sign (all pushes incl. :latest)
        if: env.PUBLISH == 'true' && github.event_name != 'pull_request'
        env:
          COSIGN_EXPERIMENTAL: '1'
        run: |
          set -euo pipefail
          source ./tools/lib/userenv.sh
          REG_HOST="${MIOS_IMAGE_NAME%%/*}"
          echo "${{ secrets.GITHUB_TOKEN }}" | \
              cosign login "${REG_HOST}" -u "${{ github.actor }}" --password-stdin
          while IFS= read -r tag; do
              [[ -z "$tag" ]] && continue
              cosign sign --yes "$tag"
          done <<< "${{ steps.meta.outputs.tags }}"

  smoke-test:
    runs-on: ubuntu-24.04
    needs: build
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install podman
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y podman

      - name: Configure host podman storage (disable metacopy)
        run: |
          sudo mkdir -p /etc/containers /mnt/tmp
          echo -e '[storage]\ndriver = "overlay"\ngraphroot = "/mnt/containers-storage"\nrunroot = "/run/containers/storage"\n[storage.options.overlay]\nmountopt = "nodev"' | sudo tee /etc/containers/storage.conf
          sudo rm -rf /var/lib/containers/storage /run/containers/storage /mnt/containers-storage
          rm -rf "${HOME}/.local/share/containers/storage" 2>/dev/null || true
          sudo podman system reset -f || true

      - name: Free disk space on the GHA runner (smoke job)
        # Same rationale as the main build job -- runner needs ~30 GB
        # extra room for the 16+ bound-image bakes during smoke build.
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Login to GHCR (raise base-image pull rate limit, smoke step)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GH_TOKEN" | sudo podman login ghcr.io \
              -u "${{ github.actor }}" --password-stdin

      - name: Smoke build (lint via Containerfile final RUN)
        run: |
          sudo TMPDIR=/mnt/tmp podman build --device /dev/fuse --cap-add all --security-opt seccomp=unconfined --security-opt apparmor=unconfined --build-arg MIOS_BAKE_BOUND_IMAGES=0 -t mios:smoke -f Containerfile .

      - name: Smoke RUN (image runs; key MiOS components present + agent-pipe compiles)
        run: bash ./tests/bake-smoke.sh mios:smoke
