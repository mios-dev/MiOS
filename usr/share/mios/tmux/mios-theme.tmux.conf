# AI-hint: tmux theme rendered by tmux_theme.py from mios.toml [colors]; tmux has no outer padding
# =====================================================================
# MiOS Canonical Tmux Theme
# Generated from mios.toml SSOT (Style: rounded)
# =====================================================================

# Status Bar Placement & Refresh Interval
set -g status on
set -g status-interval 2
set -g status-position bottom
set -g status-style "bg=#282262,fg=#E7DFD3"

# Window Status Alignment & Separation
set -g status-justify left
set -g window-status-separator ""

# Terminal Capabilities & Extended Keys
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm*:RGB"
set -as terminal-overrides ",xterm*:Tc"

# Pane Borders
set -g pane-border-style "fg=#948E8E"
set -g pane-active-border-style "fg=#F35C15"
set -g pane-border-lines heavy

# Selection & Copy Mode
set -g mode-style "bg=#1A407F,fg=#E7DFD3"

# Message & Command Prompt
set -g message-style "bg=#1A407F,fg=#E7DFD3"
set -g message-command-style "bg=#282262,fg=#F35C15"

# Rounded Glyph Formatting & Oh-My-Posh Graphics
set -g status-left-length 50
set -g status-left "#[fg=#1A407F,bg=#282262]#[fg=#E7DFD3,bg=#1A407F,bold]  MiOS #[fg=#1A407F,bg=#3E7765]#[fg=#282262,bg=#3E7765,bold]  #S #[fg=#3E7765,bg=#282262] "
set -g window-status-format "#[fg=#948E8E,bg=#282262]  #I  #W  "
set -g window-status-current-format "#[fg=#F35C15,bg=#282262]#[fg=#282262,bg=#F35C15,bold] #I  #W #[fg=#F35C15,bg=#282262]"
set -g status-right-length 100
set -g status-right "#[fg=#1A407F,bg=#282262]#[fg=#E7DFD3,bg=#1A407F]  %H:%M #[fg=#1A407F,bg=#3E7765]#[fg=#282262,bg=#3E7765,bold]  %Y-%m-%d #[fg=#3E7765,bg=#F35C15]#[fg=#282262,bg=#F35C15,bold]  #H #[fg=#F35C15,bg=#282262]"
