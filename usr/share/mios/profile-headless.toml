# AI-hint: A server-specific configuration profile for headless/inference nodes that disables GNOME, Guacamole, and remote-desktop services while enabling local AI i...
# AI-doc: usr/share/doc/mios/manual/_harvest/usr_share_mios_profile_headless_toml.md

[identity]
username  = "mios"
fullname  = "MiOS Server"
hostname  = "mios-node"
shell     = "/bin/bash"
groups    = ["wheel", "libvirt", "kvm", "video", "render", "input", "dialout", "docker"]

[locale]
timezone        = "UTC"
keyboard_layout = "us"
language        = "en_US.UTF-8"

[auth]
ssh_key_type     = "ed25519"
ssh_key_action   = "generate"
existing_ssh_key = ""
password_policy  = "interactive"
password_hash    = ""
luks_passphrase  = ""
github_pat       = ""

[network]
firewalld_default_zone = "drop"
allow_ssh              = true
allow_cockpit          = true   # server management UI (9090/tcp) -- kept for headless admin
allow_libvirt_bridge   = true

[ai]
endpoint        = "http://localhost:8640/v1"
model           = "MiOS AI"
embed_model     = "nomic-embed-text"
api_key         = ""
mcp_registry    = "/usr/share/mios/ai/mcp.json"

#------------------------------------------------------------------------------
# Desktop session -- HEADLESS: no auto-started GNOME session, no desktop apps.
#------------------------------------------------------------------------------
[desktop]
session       = "headless"   # not "gnome" -- do not auto-start a graphical session
color_scheme  = "prefer-dark"
flatpaks      = []           # no desktop flatpaks on a server node

[image]
ref    = "ghcr.io/mios-dev/mios:latest"
branch = "main"

[bootstrap]
mode             = "auto"
mios_repo        = "https://github.com/mios-dev/mios.git"
bootstrap_repo   = "https://github.com/mios-dev/mios-bootstrap.git"
install_packages = true
reboot_on_finish = true

#------------------------------------------------------------------------------
# Sidecar Quadlets -- HEADLESS: desktop / remote-desktop layers OFF, the
# server/inference stack ON. (`false` here force-disables regardless of the
# Quadlet's own Condition gating.)
#------------------------------------------------------------------------------
[quadlets.enable]
mios-ai            = true    # local inference -- the point of the node
mios-ceph          = true    # storage
mios-k3s           = true    # orchestration
mios-crowdsec-dashboard = false   # web dashboard -- headless: off (IPS itself still runs)
mios-guacamole  = false   # remote-desktop gateway -- headless: off
mios-pxe-hub    = false   # netboot hub -- opt-in only
mios-guacamole-postgres = false   # Guacamole backing store -- off with Guacamole
mios-guacd              = false   # Guacamole daemon -- off with Guacamole
