/* AI-hint: Defines the default container storage configuration for MiOS, enforcing kernel-native overlayfs with metacopy/userxattr to ensure rootless container compatibility in restricted environments like WSL2. */
/* AI-doc: usr/share/doc/mios/manual/containers.md */

[storage]
driver = "overlay"
runroot = "/run/containers/storage"
graphroot = "/var/lib/containers/storage"

[storage.options]
# Logically-bound-image store baked into immutable /usr by the OCI
# build (see /etc/containers/storage.conf for the full rationale --
# ARCHITECTURAL LAW 3, BOUND-IMAGES). Kept in sync with the /etc layer.
additionalimagestores = ["/usr/lib/containers/storage"]

[storage.options.overlay]
# Empty mount_program = kernel-native overlay. NOT fuse-overlayfs.
mount_program = ""
mountopt = "nodev,metacopy=on,userxattr"

[storage.options.thinpool]
