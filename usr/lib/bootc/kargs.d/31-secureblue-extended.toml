# AI-hint: Defines kernel arguments for the MiOS bootloader to enforce SecureBlue-derived hardening, including memory protections, IOMMU strictness, and...
# AI-doc: usr/share/doc/mios/manual/kargs.d.md
match-architectures = ["x86_64"]
kargs = [
    "page_poison=1",
    "slub_debug=FZ",
    "debugfs=off",
    "oops=panic",
    "iommu=force",
    "iommu.strict=1",
    "iommu.passthrough=0",
    "random.trust_bootloader=off",
    "random.trust_cpu=off",
    "efi=disable_early_pci_dma",
    "itlb_multihit=flush,force",
    "tsx_async_abort=full,force",
    "mds=full,force"
]
