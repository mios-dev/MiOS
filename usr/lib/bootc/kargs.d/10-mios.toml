# AI-hint: Defines bootc kernel arguments for x86_64 systems, enforcing integrity lockdown, disabling memory randomization, and configuring NVIDIA driver behavior and ...
# AI-doc: usr/share/doc/mios/manual/_harvest/usr_lib_bootc_kargs_d_10_mios_toml.md

kargs = [
  "lockdown=integrity",
  "init_on_alloc=0",
  "init_on_free=0",
  "page_alloc.shuffle=0",
  "rd.driver.blacklist=nouveau",
  "modprobe.blacklist=nouveau",
  "nvidia-drm.modeset=1",
  "nvidia.NVreg_PreserveVideoMemoryAllocations=1",
]
match-architectures = ["x86_64"]
