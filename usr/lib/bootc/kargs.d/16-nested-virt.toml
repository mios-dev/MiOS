# AI-hint: Configures kernel arguments to enable nested virtualization (KVM/EPT/Shadow VMCS) for x86_64 architectures, allowing nested VMs or Podman machines to...
# AI-doc: usr/share/doc/mios/manual/_harvest/usr_lib_bootc_kargs_d_16_nested_virt_toml.md
