# AI-hint: Defines core kernel boot arguments for MiOS, including IOMMU settings, Nouveau driver blacklisting, and serial console configurations for x86_64 systems.
# AI-doc: usr/share/doc/mios/manual/kargs.d.md

kargs = [
    "iommu=pt",
    "amd_iommu=on",
    "rd.driver.blacklist=nouveau",
    "modprobe.blacklist=nouveau",
    "systemd.show-status=true",
    "systemd.mount-extra=/var/lib/containers:none:bind,rw,x-systemd.makefs",
    "console=tty0",
    "console=ttyS0,115200n8"
]
match-architectures = ["x86_64"]
