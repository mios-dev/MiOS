/* AI-hint: Configures systemd-sysupdate to fetch and verify MiOS system images from a remote URL, mapping them to the local root partition for atomic A/B updates in UKI/SecureBoot environments. */
/* AI-doc: usr/share/doc/mios/manual/_harvest/usr_lib_sysupdate_d_50_mios_conf.md */

[Transfer]
Verify=yes

[Source]
Type=url-file
Path=https://ghcr.io/mios-dev/updates/
MatchPattern=mios-@v.root-x86-64.verity

[Target]
Type=partition
Path=auto
# Matches the Discoverable Partitions Spec (DPS)
MatchPattern=root-x86-64
Mode=0444
ReadOnly=yes
