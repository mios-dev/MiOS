/* AI-hint: Configures the XDG_RUNTIME_DIR environment variable for user instances to ensure systemd user managers start correctly in WSL2 environments where pam_systemd cannot provide the session path. */
/* AI-doc: usr/share/doc/mios/manual/_harvest/usr_lib_systemd_system_user@_service_d_10_mios_wsl_runtime_conf.md */

[Service]
Environment=XDG_RUNTIME_DIR=/run/user/%i
