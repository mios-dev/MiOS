/* AI-hint: Overrides cockpit-wsinstance-socket-user.service to disable namespace-requiring security features when running inside a container, ensuring the Cockpit dashboard remains accessible in MiOS-DEV/podman environments. */
[Service]
# Strip every namespace-requiring directive. DynamicUser=no + a static
# UnsetEnvironment block let the unit actually start; the /run/cockpit/
# wsinstance/ socket dir falls back to the cockpit user that the RPM
# already creates statically.
DynamicUser=no
PrivateTmp=no
PrivateMounts=no
PrivateDevices=no
PrivateUsers=no
ProtectHome=no
ProtectSystem=no
ProtectControlGroups=no
ProtectKernelModules=no
ProtectKernelTunables=no
ProtectKernelLogs=no
RestrictNamespaces=no
RestrictRealtime=no
LockPersonality=no
NoNewPrivileges=no
SystemCallFilter=
User=cockpit-ws
Group=cockpit-ws
