/* AI-doc: usr/share/doc/mios/manual/_harvest/usr_lib_systemd_system_systemd_logind_service_d_dbus_conf.md */

[Unit]
ConditionPathExists=|/usr/bin/dbus-daemon
ConditionPathExists=|/usr/bin/dbus-broker
