/* AI-hint: Drop-in configuration that disables namespace isolation (DynamicUser, PrivateMounts, etc.) for the cockpit-wsinstance-http.socket when running inside a container to ensure successful socket binding. */
/* AI-doc: usr/share/doc/mios/manual/_harvest/usr_lib_systemd_system_cockpit_wsinstance_http_socket_d_10_mios_container_conf.md */

[Socket]
DynamicUser=no
PrivateTmp=no
PrivateMounts=no
PrivateDevices=no
PrivateUsers=no
ProtectHome=no
ProtectSystem=no
RestrictNamespaces=no
