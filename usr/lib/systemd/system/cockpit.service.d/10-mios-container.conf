# AI-hint: Disables systemd namespace isolation hardening for the cockpit.service unit to allow the service to start successfully within unprivileged environments like WSL2, Podman containers, or Distrobox.
[Service]
# Namespace isolation -- every directive that triggers CLONE_NEWNS:
PrivateNetwork=no
PrivateIPC=no
PrivateMounts=no
PrivateTmp=no
PrivateDevices=no
PrivateUsers=no
# ProtectSystem= and ProtectHome= remount /usr / /etc / /home read-only via
# a private mount namespace. Both must be off for the EOPNOTSUPP path.
ProtectSystem=no
ProtectHome=no
ProtectHostname=no
ProtectClock=no
ProtectKernelTunables=no
ProtectKernelModules=no
ProtectKernelLogs=no
ProtectControlGroups=no
ProtectProc=default
ProcSubset=all
# Process / capability hardening -- not strictly mount-namespace, but the
# certificate-ensure helper doesn't need them and they confuse some
# minimal containers (LXC, podman with --privileged=false).
NoNewPrivileges=no
RestrictNamespaces=no
RestrictRealtime=no
RestrictSUIDSGID=no
LockPersonality=no
MemoryDenyWriteExecute=no
# Reset list-typed directives so any inherited ReadWritePaths=/...
# doesn't smuggle a private mount back in.
SystemCallFilter=
SystemCallArchitectures=
RestrictAddressFamilies=
DeviceAllow=
ReadWritePaths=
ReadOnlyPaths=
InaccessiblePaths=
# These also trigger exec_needs_mount_namespace() in src/core/exec-invoke.c.
# Resetting them is cheap insurance against a future cockpit-ws unit-file
# bump that adds any of them upstream:
BindPaths=
BindReadOnlyPaths=
TemporaryFileSystem=
ExtensionDirectories=
ExtensionImages=
RootDirectory=
RootImage=
MountAPIVFS=no
DynamicUser=no
RestrictFileSystems=
