# AI-hint: Defines systemd-tmpfiles permissions and ownership for Headscale configuration and runtime data directories to ensure the containerized service (UID 833) can access its config and database.
# AI-doc: usr/share/doc/mios/manual/tmpfiles.d.md
d /etc/headscale         0750 mios-headscale mios-headscale -
d /var/lib/headscale     0750 mios-headscale mios-headscale -
d /run/headscale         0750 mios-headscale mios-headscale -
