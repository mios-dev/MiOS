/* AI-hint: Defines filesystem permissions and ownership for CrowdSec persistence directories and configuration paths to ensure database integrity and service availability on bootc/immutable systems. */
/* AI-doc: usr/share/doc/mios/manual/tmpfiles.d.md */
d /var/lib/crowdsec      0750 root root -
d /var/lib/crowdsec/data 0750 root root -
d /etc/crowdsec          0755 root root -
d /etc/crowdsec/acquis.d 0755 root root -
