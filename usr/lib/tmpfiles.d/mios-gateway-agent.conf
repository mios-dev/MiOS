# AI-hint: Defines filesystem permissions and ownership for the gateway-agent runtime.
# AI-related: /etc/mios/gateway, /usr/share/mios/gateway, mios-gateway-agent, mios-ai
# /usr/lib/tmpfiles.d/mios-gateway-agent.conf
# 'MiOS' gateway-agent runtime directories.

d /etc/mios/gateway 0755 root root -
d /var/lib/mios/gateway 0750 mios-ai mios-ai -
d /var/lib/mios/skills 0750 mios-ai mios-ai -

# Vendor config copy-if-absent.
C /etc/mios/gateway/config.yaml 0640 mios-ai mios-ai - /usr/share/mios/gateway/config.yaml
