/* AI-hint: Defines systemd tmpfiles for NFS state directories, ensuring /var/lib/nfs/sm and sm.bak exist to prevent sm-notify errors during WSL2 boots and manage RPC lock states. */
/* AI-doc: usr/share/doc/mios/manual/_harvest/usr_lib_tmpfiles_d_mios_nfs_conf.md */
d /var/lib/nfs        0755 root root -
d /var/lib/nfs/statd  0755 rpcuser rpcuser -
d /var/lib/nfs/sm     0755 rpcuser rpcuser -
d /var/lib/nfs/sm.bak 0755 rpcuser rpcuser -
