# AI-hint: Declarative tmpfiles configuration for Nix multi-user store on bootc/ostree immutable host.
# Links /nix to persistent /var/nix and establishes store/daemon directory hierarchies with nixbld ownership.
# AI-doc: usr/share/doc/mios/manual/tmpfiles.d.md

# Symlink top-level /nix to persistent storage in /var/nix
L+ /nix                      -    -    -       - /var/nix

# Persistent store and state hierarchies in /var/nix
d /var/nix                   0755 root root    -
d /var/nix/store             1775 root nixbld  -
d /var/nix/var               0755 root root    -
d /var/nix/var/nix           0755 root root    -
d /var/nix/var/nix/gcroots   1777 root root    -
d /var/nix/var/nix/profiles  1777 root root    -
d /var/nix/var/nix/profiles/per-user 1777 root root -
d /var/nix/var/nix/temproots 1777 root root    -
d /var/nix/var/nix/userpool  1777 root root    -
d /var/nix/var/log           0755 root root    -
d /var/nix/var/log/nix       0755 root root    -
d /var/nix/var/log/nix/drvs  1777 root root    -
