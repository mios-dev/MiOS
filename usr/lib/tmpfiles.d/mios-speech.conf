# AI-hint: Persistent model storage for the mios-ai pod's streaming speech engines (Piper TTS; whisper.cpp loads the model baked into its image), bind-mounted read-only at /models.
# AI-related: usr/share/containers/systemd/mios-whisper.container, usr/share/containers/systemd/mios-piper.container, usr/share/mios/mios.toml
# Paths and owners are [services.piper] model_dir and uid/gid
# in mios.toml; test_mios_speech_storage.py holds them equal (T-1140).
d /var/lib/mios/piper          0755 root         root         -
d /var/lib/mios/piper/models   0755 mios-piper   mios-piper   -
