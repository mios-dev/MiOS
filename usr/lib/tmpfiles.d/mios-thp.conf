# AI-hint: Configures Transparent Huge Pages (THP) in madvise mode with asynchronous khugepaged defragmentation (T-800).
# AI-doc: usr/share/doc/mios/manual/ch12-memory-compaction-and-thp.md
w- /sys/kernel/mm/transparent_hugepage/enabled - - - - madvise
w- /sys/kernel/mm/transparent_hugepage/defrag - - - - defer+madvise
w- /sys/kernel/mm/transparent_hugepage/khugepaged/scan_sleep_millisecs - - - - 10000
