/* AI-hint: Configures systemd user-level symlinks to ensure the mios-wsl-env-import and mios-wsl-graphical-session services are automatically activated for WSLg graphical sessions. */
/* AI-doc: usr/share/doc/mios/manual/_harvest/usr_lib_tmpfiles_d_mios_wslg_wants_conf.md */

d /etc/systemd/user/default.target.wants 0755 root root -

L+ /etc/systemd/user/default.target.wants/mios-wsl-env-import.service        - - - - ../../../../usr/lib/systemd/user/mios-wsl-env-import.service
L+ /etc/systemd/user/default.target.wants/mios-wsl-graphical-session.service - - - - ../../../../usr/lib/systemd/user/mios-wsl-graphical-session.service
