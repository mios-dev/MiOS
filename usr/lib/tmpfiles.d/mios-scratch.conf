/* AI-hint: Defines the global shared scratchpad at /var/lib/mios/scratch with 1777 permissions, providing a common writable workspace for all MiOS agents to store notes, JSON handoffs, and session-specific data. */
/* AI-doc: usr/share/doc/mios/manual/_harvest/usr_lib_tmpfiles_d_mios_scratch_conf.md */

d /var/lib/mios/scratch 1777 root root - -
# Sub-dirs that show up commonly enough to pre-create:
d /var/lib/mios/scratch/sessions 1777 root root - -
d /var/lib/mios/scratch/handoffs 1777 root root - -
d /var/lib/mios/scratch/notes    1777 root root - -
