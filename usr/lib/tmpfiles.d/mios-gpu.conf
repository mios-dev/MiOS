/* AI-hint: Defines systemd-tmpfiles for GPU runtime directories, CDI paths, and NVIDIA container toolkit configurations to ensure persistent mount points and environment files for GPU acceleration. 'MiOS' v0.2.4 -- GPU runtime directories. */
/* AI-doc: usr/share/doc/mios/manual/_harvest/usr_lib_tmpfiles_d_mios_gpu_conf.md */
d /run/mios                              0755 root root -
d /run/cdi                               0755 root root -
d /etc/cdi                               0755 root root -
d /var/lib/mios                          0755 root root -
d /var/lib/mios/gpu                      0755 root root -
# nvidia-container-toolkit reads /etc/nvidia-container-toolkit/cdi-refresh.env
# from a hard-coded path in its upstream systemd unit. Treat /etc/ as the
# upstream-contract surface; seed defaults via `f` (create-if-missing).
d /etc/nvidia-container-toolkit          0755 root root -
f /etc/nvidia-container-toolkit/cdi-refresh.env 0644 root root - CDI_OUTPUT_PATH=/run/cdi/nvidia.yaml\nNVIDIA_CTK_DEBUG=0
