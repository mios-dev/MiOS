# AI-hint: Configures systemd-tmpfiles to enforce 1777 permissions on /tmp and /var/tmp to ensure non-root traversability for mios-hermes sockets and mktemp operations.
# AI-doc: usr/share/doc/mios/manual/tmpfiles.d.md
# Only the directories are shared/sticky. Recursive Z also changes build
# artifacts, toolchains and private temporary files inside them.
z /tmp     1777 root root - -
z /var/tmp 1777 root root - -
