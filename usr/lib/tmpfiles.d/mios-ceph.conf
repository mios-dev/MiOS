# AI-hint: Defines systemd tmpfiles for Ceph orchestration, ensuring critical directories like /var/lib/ceph/crash/posted exist to prevent ceph-crash.service startup warnings and ensure proper storage path availability.
# AI-doc: usr/share/doc/mios/manual/tmpfiles.d.md
d /etc/ceph 0755 root root -
d /var/lib/ceph 0755 root root -
d /var/lib/ceph/crash 0755 root root -
d /var/lib/ceph/crash/posted 0755 root root -
# radosgw state ([storage.s3_gateway].data_dir), bind-mounted by mios-radosgw.container;
# podman cannot bind a source that does not exist.
d /var/lib/mios/radosgw 0750 root root -
