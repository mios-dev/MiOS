# AI-hint: Per-user configuration file for MiOS that overrides system-wide defaults for identity, locale, AI endpoints, and desktop preferences, serving as the highest-pr...
# AI-doc: usr/share/doc/mios/manual/_harvest/etc_skel__config_mios_mios_toml.md

[identity]
# `username` is fixed (it's your own login). Override fullname only.
fullname = "MiOS User"

[locale]
timezone        = "UTC"
keyboard_layout = "us"
language        = "en_US.UTF-8"

[ai]
# Per-user AI overrides. endpoint MUST stay on localhost (Architectural
# Law 5: UNIFIED-AI-REDIRECTS). Postcheck #12 enforces this in active config.
endpoint = "http://localhost:8640/v1"
model    = "default"
api_key  = ""

[desktop]
# Per-user desktop preferences override the system defaults.
color_scheme = "prefer-dark"

[env]
# Free-form per-user env overrides. Keys must match POSIX env-var rules
# ([A-Za-z_][A-Za-z0-9_]*). Anything here is exported verbatim by
# tools/lib/userenv.sh into every script that sources it.
