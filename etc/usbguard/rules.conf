# AI-hint: Declarative USBGuard authorization rules for the MiOS security subsystem (T-798).
# AI-doc: usr/share/doc/mios/manual/ch14-usbguard-and-badusb-mitigation.md

# 1. Allow all USB Hubs (physical root hubs and hub chips)
allow with-interface equals { 09:*:* }

# 2. Allow Enrolled MiOS-USB Cryptographic Hardware Tokens
allow id 1050:* name "Yubico*" with-interface equals { 03:*:* 0b:*:* }
allow id 20a0:* name "Nitrokey*" with-interface equals { 03:*:* 0b:*:* }

# 3. Allow Standard Human Interface Devices (Standard Boot Keyboards and Mice)
allow with-interface equals { 03:01:01 }
allow with-interface equals { 03:01:02 }

# 4. Reject Compound BadUSB Keystroke Injectors (HID keyboard + Mass Storage or composite fake HID)
block with-interface equals { 03:*:* } with-interface equals { 08:*:* }

# 5. Allow Smart Card interfaces for security keys
allow with-interface equals { 0b:*:* }

# 6. Allow USB Mass Storage (Mount enforcement handled via udisks2 read-only policy)
allow with-interface equals { 08:*:* }

# 7. Default fallback: Block unauthorized injection devices
block with-interface equals { 03:*:* }
