/* AI-hint: Defines the global podman/containerd storage backend (overlay driver) and critical mount_program overrides to ensure compatibility with WSL2 and nested container environments. */
/* AI-doc: usr/share/doc/mios/manual/containers.md */

[storage]
driver = "overlay"

[storage.options]
additionalimagestores = ["/usr/lib/containers/storage"]

[storage.options.overlay]
# Empty mount_program => kernel-native overlayfs. NOT fuse-overlayfs.
mount_program = ""
mountopt = "nodev,metacopy=on,userxattr"
